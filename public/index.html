<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a09">
<meta name="description" content="Your private listening history, local music archive, and player.">
<title>Music Taste</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb; --card: #f0efec; --line: #dddcd6;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a887f;
    --accent: #2a78d6; --accent-soft: #cde2fb; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --card: #262624; --line: #383835;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8a887f;
      --accent: #3987e5; --accent-soft: #104281; --bad: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, sans-serif;
    padding: 1.2rem clamp(1rem, 4vw, 3rem) 4rem;
  }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; }
  h1 a { color: inherit; text-decoration: none; }
  #sync { color: var(--ink-3); font-size: .8rem; }
  nav { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  nav button {
    border: 1px solid var(--line); background: none; color: var(--ink-2);
    padding: .35rem .8rem; border-radius: 999px; cursor: pointer; font: inherit; font-size: .85rem;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tools { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  input[type=search] {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: .45rem .8rem; font: inherit; width: min(320px, 100%);
  }
  label.chk { color: var(--ink-2); font-size: .85rem; display: flex; gap: .35rem; align-items: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .7rem; margin-bottom: 1.4rem; }
  .tile { background: var(--card); border-radius: 10px; padding: .8rem .9rem; }
  .tile b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--ink-2); font-size: .78rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 1rem; }
  .card { background: var(--card); border-radius: 12px; padding: 1rem 1.1rem; }
  .card h2, main h2 { font-size: .95rem; margin-bottom: .8rem; }
  main h2 { margin-top: 1.6rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .9rem; }
  .cell { background: var(--card); border-radius: 10px; padding: .6rem; }
  .pic { position: relative; width: 100%; aspect-ratio: 1; }
  .pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
  .pic .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             background: var(--accent-soft); color: var(--accent); font-size: 2rem; font-weight: 700;
             border-radius: 8px; }
  /* "downloaded in the Lidarr library" marker, overlaid on album art */
  .pic .dl { position: absolute; top: .3rem; right: .3rem; width: 1.5rem; height: 1.5rem;
             display: flex; align-items: center; justify-content: center;
             background: var(--accent); color: #fff; border-radius: 6px;
             box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
  .pic .dl svg { width: 1rem; height: 1rem; }
  .cell .nm { font-size: .85rem; font-weight: 600; margin-top: .4rem;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .sub, .sub { font-size: .74rem; color: var(--ink-2);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: .25rem; flex-wrap: wrap; margin-top: .3rem; }
  .chip { font-size: .66rem; color: var(--ink-2); border: 1px solid var(--line);
          border-radius: 999px; padding: .05rem .45rem; white-space: nowrap; }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; gap: .8rem; align-items: center; padding: .45rem .3rem;
         border-bottom: 1px solid var(--line); }
  .row.gone { opacity: .55; }
  .row .pic { width: 38px; height: 38px; flex: none; aspect-ratio: auto; }
  .row .pic .ph { font-size: 1rem; }
  .row .mid { flex: 1; min-width: 0; }
  .row .mid div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .mid .sub { color: var(--ink-2); font-size: .8rem; }
  .row .end { color: var(--ink-3); font-size: .78rem; text-align: right; flex: none;
              font-variant-numeric: tabular-nums; }
  .rank { color: var(--ink-3); font-variant-numeric: tabular-nums; width: 2em; flex: none; text-align: right; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  a.ext { color: var(--ink-3); font-size: .8rem; flex: none; padding: 0 .2rem; }
  .spbtn { display: inline-block; background: none; border: 1px solid var(--line); color: var(--ink-2);
           border-radius: 999px; padding: .3rem .9rem; font-size: .8rem; margin-top: .5rem; }
  .spbtn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .hero { display: flex; gap: 1.2rem; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; }
  .hero .pic { width: clamp(120px, 22vw, 180px); flex: none; }
  .hero h1 { font-size: 1.5rem; margin-bottom: .2rem; }
  .hero .meta { color: var(--ink-2); font-size: .85rem; margin-top: .15rem; }
  .bars { display: grid; grid-template-columns: minmax(90px, max-content) 1fr max-content;
          gap: .3rem .6rem; align-items: center; }
  .bars .lbl { font-size: .8rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; max-width: 180px; }
  .bars .bar { height: 10px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .bars .n { font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  svg text { fill: var(--ink-2); font-size: 10px; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface);
         font-size: .75rem; padding: .25rem .55rem; border-radius: 6px; opacity: 0;
         transition: opacity .08s; z-index: 10; white-space: nowrap; }
  .empty { color: var(--ink-3); padding: 2rem 0; text-align: center; }
  .note { color: var(--ink-3); font-size: .8rem; margin: .4rem 0 1rem; }
  .seg { display: flex; gap: .3rem; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--line); background: none; color: var(--ink-2);
                padding: .25rem .7rem; border-radius: 8px; cursor: pointer; font: inherit; font-size: .8rem; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .heart { color: var(--accent); flex: none; width: 1.1em; text-align: center; }
</style>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to collection</a>
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>
<div class="app-shell">
  <aside class="sidebar">
    <header class="brand-head">
      <a class="brand" href="#overview" aria-label="Music Taste home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span><b>Music Taste</b><small>Private archive</small></span>
      </a>
    </header>
    <nav id="nav" aria-label="Library"></nav>
    <div class="sidebar-foot">
      <div class="archive-state" id="archive-state" data-state="checking">
        <span class="state-dot" aria-hidden="true"></span>
        <span><b id="archive-label">Checking archive</b><small id="archive-detail">Jellyfin connection</small></span>
      </div>
      <div id="sync"></div>
    </div>
  </aside>
  <section class="content-shell">
    <header class="page-head">
      <div>
        <span class="page-kicker" id="page-kicker">Your listening memory</span>
        <h1 id="page-title">The collection</h1>
      </div>
      <button class="wake-button" id="wake-button" type="button" hidden>Wake eliot</button>
    </header>
    <main id="main" tabindex="-1"><div class="empty">Loading your archive…</div></main>
  </section>
</div>

<section class="player-bar" id="player-bar" data-state="idle" aria-label="Music player">
  <audio id="audio" preload="metadata"></audio>
  <div class="player-track">
    <div class="player-art"><img id="player-art" alt=""><span id="player-art-fallback">MT</span></div>
    <div class="player-copy">
      <span class="player-overline" id="player-overline">Local archive</span>
      <b id="player-title">Choose a track</b>
      <span id="player-byline">Play from your downloaded collection</span>
    </div>
  </div>
  <div class="player-transport">
    <div class="player-controls">
      <button class="player-icon" id="previous-button" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3 7 9-7v14z"/></svg>
      </button>
      <button class="player-play" id="player-play" type="button" aria-label="Play" disabled>
        <svg class="play-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
        <svg class="pause-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button class="player-icon" id="next-button" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg>
      </button>
    </div>
    <div class="scrubber-row">
      <span id="elapsed">0:00</span>
      <input id="scrubber" type="range" min="0" max="1000" value="0" aria-label="Track position" disabled>
      <span id="remaining">−0:00</span>
    </div>
  </div>
  <div class="player-actions">
    <button class="queue-button" id="queue-button" type="button" aria-expanded="false" aria-controls="queue-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 11h12M4 16h8M18 14v6m-3-3h6"/></svg>
      <span id="queue-count">0</span>
    </button>
    <label class="volume-control">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="Volume">
    </label>
  </div>
</section>

<aside class="queue-panel" id="queue-panel" aria-label="Play queue" hidden>
  <div class="queue-head"><div><span>Next up</span><b>Your queue</b></div><button id="queue-close" type="button" aria-label="Close queue">×</button></div>
  <div id="queue-list" class="queue-list"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dur = (ms) => { const s = Math.round((ms ?? 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const day = (iso) => (iso ?? '').slice(0, 10);
const ago = (iso) => {
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  if (m < 60) return `${Math.max(1, Math.round(m))}m ago`;
  if (m < 1440) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
};
// Local archive first (survives Spotify deletions), CDN fallback, then initial.
function imgErr(el) {
  const cdn = el.dataset.cdn;
  if (cdn) { el.removeAttribute('data-cdn'); el.src = cdn; return; }
  el.style.display = 'none';
  el.nextElementSibling.style.display = 'flex';
}
// Download glyph (down-arrow into a tray) + the overlay badge for downloaded albums.
const DL = '<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path fill="currentColor" d="M11 3h2v8h3l-4 4-4-4h3z"/><path fill="currentColor" d="M5 19h14v2H5z"/></svg>';
const dlBadge = `<span class="dl" title="downloaded in the library">${DL}</span>`;
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>';
const playControl = (track) => track.id ? `<button class="track-play" type="button" data-track-id="${esc(track.id)}" data-track-name="${esc(track.name)}" data-track-artists="${esc(track.artists ?? track.artist_name ?? '')}" data-track-duration="${Number(track.duration_ms ?? 0)}" aria-label="Play ${esc(track.name)}">${PLAY}</button>` : '';
const pic = (kind, id, cdnUrl, name, overlay = '') => `
  <div class="pic">
    <img src="${id ? `/img/${kind}/${esc(id)}.jpg` : ''}" alt="" loading="lazy"
         data-cdn="${esc(cdnUrl ?? '')}" onerror="imgErr(this)">
    <div class="ph" style="display:none">${esc((name ?? '?')[0].toUpperCase())}</div>
    ${overlay}
  </div>`;
const spotify = (type, id) => `<a class="ext" href="https://open.spotify.com/${type}/${id}" target="_blank" rel="noopener" title="open in Spotify">↗</a>`;
const spbtn = (type, id) => `<a class="spbtn" href="https://open.spotify.com/${type}/${id}" target="_blank" rel="noopener">Open in Spotify ↗</a>`;
const genres = (json, n = 3) => { try { return JSON.parse(json ?? '[]').slice(0, n); } catch { return []; } };
const chips = (list) => list.length ? `<div class="chips">${list.join('')}</div>` : '';
const chip = (text, bad = false) => `<span class="chip${bad ? ' bad' : ''}">${esc(text)}</span>`;
const gchips = (json, n = 3) => chips(genres(json, n).map((g) => chip(g)));
// Tombstone badges — history is kept, these say what changed and when.
const badges = (row) => chips([
  row.removed_at ? chip(`removed from spotify ${day(row.removed_at)}`, true) : '',
  row.unfollowed_at && !row.is_followed ? chip(`unfollowed ${day(row.unfollowed_at)}`) : '',
  row.unsaved_at && !row.is_saved ? chip(`unsaved ${day(row.unsaved_at)}`) : '',
].filter(Boolean));

const cache = {};
async function api(p) { return cache[p] ??= await (await fetch(p)).json(); }

const tip = $('#tip');
function tipOn(el, text) {
  el.addEventListener('mousemove', (e) => {
    tip.textContent = text;
    tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - 30) + 'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
}

function monthChart(data, word = 'liked') {
  if (!data.length) return '<div class="empty">no data</div>';
  const W = 640, H = 150, pad = 4, bw = Math.max(2, Math.floor(W / data.length) - 2);
  const max = Math.max(...data.map((d) => d.n));
  const peak = data.reduce((a, b) => (b.n > a.n ? b : a));
  const bars = data.map((d, i) => {
    const h = Math.max(2, Math.round((d.n / max) * (H - 30)));
    const x = Math.round((i / data.length) * W);
    const label = d === peak ? `<text x="${x + bw / 2}" y="${H - h - 26}" text-anchor="middle">${d.n}</text>` : '';
    return `<g data-tip="${esc(d.month)} · ${d.n} ${word}">${label}<rect x="${x}" y="${H - h - 20}" width="${bw}" height="${h}" rx="2" fill="var(--accent)"/></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${bars}
    <text x="${pad}" y="${H - 6}">${esc(data[0].month)}</text>
    <text x="${W - pad}" y="${H - 6}" text-anchor="end">${esc(data[data.length - 1].month)}</text></svg>`;
}

const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// Streams ALL pages of a paged endpoint into the DOM automatically (small
// pauses between pages keep the browser responsive). Everything ends up
// rendered, so browser find (cmd+F) sees the whole library. Search restarts
// the stream; a generation counter cancels a superseded run.
function pager({ url, pageSize, container, moreBtn, render, empty }) {
  if (moreBtn) moreBtn.style.display = 'none';
  let q = '', gen = 0;
  const start = async () => {
    const g = ++gen;
    let offset = 0;
    while (g === gen) {
      const rows = await (await fetch(`${url}?q=${encodeURIComponent(q)}&limit=${pageSize}&offset=${offset}`)).json();
      if (g !== gen) return;
      if (offset === 0) container.innerHTML = '';
      container.insertAdjacentHTML('beforeend', rows.map(render).join(''));
      if (offset === 0 && !rows.length) container.innerHTML = `<div class="empty">${empty}</div>`;
      offset += rows.length;
      if (rows.length < pageSize) return;
      await new Promise((r) => setTimeout(r, 30));
    }
  };
  start();
  return { search(v) { q = v; start(); } };
}

// Album header + compact track rows for the grouped Songs sections.
const groupHead = (al) => `
  <div class="row" style="border-bottom:none;padding-top:1rem">
    <a href="#album/${al.id}">${pic('albums', al.id, al.image_url, al.name)}</a>
    <div class="mid">
      <div><a href="#album/${al.id}"><b>${esc(al.name)}</b></a>${al.removed_at ? ' ' + chip(`removed ${day(al.removed_at)}`, true) : ''}</div>
      <div class="sub">${esc(al.artists ?? '')}${al.release_date ? ' · ' + al.release_date.slice(0, 4) : ''}</div>
    </div>
  </div>`;
const slimRow = (t, endText) => `
  <div class="row slim-row${t.removed_at ? ' gone' : ''}">
    ${playControl(t)}
    <span class="heart">${t.liked || (t.added_at && !t.removed_at) ? '♥' : ''}</span>
    <div class="mid"><div>${esc(t.name)} ${t.removed_at ? chip(`un-liked ${day(t.removed_at)}`, true) : ''}</div></div>
    <div class="end">${endText ?? dur(t.duration_ms)}</div>
    ${spotify('track', t.id)}
  </div>`;
const songGroup = (al) => groupHead(al) + `<div class="rows">${al.tracks.map((t) => slimRow(t)).join('')}</div>`;

// Track row: internal album link, explicit ↗ for Spotify. `gone` greys +
// badges rows that were un-liked / removed from a playlist.
const trackRow = (t, endText, rank) => {
  const gone = t.removed_at;
  const albumHref = t.album_id ? `#album/${t.album_id}` : null;
  return `
  <div class="row${gone ? ' gone' : ''}">${rank != null ? `<span class="rank">${rank}</span>` : ''}
    ${playControl(t)}
    ${albumHref ? `<a href="${albumHref}">` : ''}${pic('albums', t.album_id, t.image_url, t.album ?? t.name)}${albumHref ? '</a>' : ''}
    <div class="mid">
      <div>${esc(t.name)} ${gone ? chip(`removed ${day(gone)}`, true) : ''}</div>
      <div class="sub">${esc(t.artists ?? '')}${t.album ? ` · <a href="${albumHref ?? '#'}">${esc(t.album)}</a>` : ''}</div>
    </div>
    <div class="end">${endText}</div>
    ${spotify('track', t.id)}
  </div>`;
};

const eventRow = (e) => `
  <div class="row">
    <div class="end" style="text-align:left;min-width:6.5em">${(e.datetime ?? '').slice(0, 10)}</div>
    ${e.artist_id ? `<a href="#artist/${e.artist_id}">` : ''}${pic('artists', e.artist_id, e.image_url, e.artist_name)}${e.artist_id ? '</a>' : ''}
    <div class="mid">
      <div>${e.artist_id ? `<a href="#artist/${e.artist_id}"><b>${esc(e.artist_name ?? '')}</b></a>` : esc(e.artist_name ?? '')}</div>
      <div class="sub">${esc(e.venue ?? '')}${e.city ? ' · ' + esc(e.city) : ''}${e.country ? ' (' + esc(e.country) + ')' : ''}</div>
    </div>
    ${e.url ? `<a class="spbtn" style="margin:0;flex:none" href="${esc(e.url)}" target="_blank" rel="noopener">Tickets ↗</a>` : ''}
  </div>`;

const albumCell = (a) => `
  <div class="cell">
    <a href="#album/${a.id}">${pic('albums', a.id, a.image_url, a.name, a.downloaded ? dlBadge : '')}
      <div class="nm">${esc(a.name)}</div></a>
    <div class="sub">${esc(a.artists ?? '')}</div>
    <div class="sub">${(a.release_date ?? '').slice(0, 4)}${a.album_group && a.album_group !== 'album' ? ' · ' + esc(a.album_group) : ''}${a.is_saved ? ' · saved ✓' : ''}</div>
    ${badges(a)}
  </div>`;

const views = {
  async overview() {
    const s = await api('/api/stats');
    const c = s.counts;
    const h = s.history;
    const tiles = [['liked songs', c.liked], ['artists', c.artists], ['followed', c.followed],
                   ['saved albums', c.albums], ['playlists', c.playlists], ['plays captured', c.plays],
                   ...(h ? [['lifetime plays', Number(h.n).toLocaleString()], ['hours listened', Math.round(h.ms / 3.6e6).toLocaleString()]] : [])]
      .map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join('');
    // Albums actually in the download library (from the Lidarr sync). Leads the
    // row, accent-coloured, with the ⤓ icon and a freshness stamp.
    const dlTile = `<div class="tile download-tile"><b>${DL} ${(c.downloaded ?? 0).toLocaleString()}</b>` +
      `<span>albums downloaded${s.downloadsSyncedAt ? ` · ${ago(s.downloadsSyncedAt)}` : ''}</span></div>`;
    const gmax = Math.max(...s.genres.map((g) => g.n), 1);
    const gbars = s.genres.map((g) => `
      <div class="lbl">${esc(g.genre)}</div>
      <div class="bar" style="width:${Math.round((g.n / gmax) * 100)}%" data-tip="${esc(g.genre)} · ${g.n} liked tracks"></div>
      <div class="n">${g.n}</div>`).join('');
    return `<section class="overview-hero">
        <div>
          <span class="eyebrow">Local listening archive</span>
          <h2>The songs that stayed, <em>ready to play.</em></h2>
          <p>Spotify remembers the signals. Your local archive keeps the records. Music Taste brings both sides together without pretending a file exists when it does not.</p>
        </div>
        <aside class="hero-signal"><span>Downloaded now</span><b>${Number(c.downloaded ?? 0).toLocaleString()} albums</b><small>${s.downloadsSyncedAt ? `Library checked ${ago(s.downloadsSyncedAt)}` : 'Waiting for the first Lidarr library snapshot'}</small></aside>
      </section>
      <div class="tiles">${dlTile}${tiles}</div>
      <div class="cards">
        <div class="card"><h2>Liked songs added per month</h2>${monthChart(s.likedPerMonth)}</div>
        <div class="card"><h2>Top genres (by liked tracks)</h2>
          ${s.genres.length ? `<div class="bars">${gbars}</div>` : '<div class="empty">genres still hydrating — check back after the next sync</div>'}</div>
        ${h ? `<div class="card"><h2>Lifetime listening per month (${day(h.first)} → ${day(h.last)})</h2>${monthChart(h.perMonth, 'plays')}</div>` : ''}
      </div>
      ${s.releases?.length ? `<h2>New & upcoming from artists you follow (last 90 days)</h2><div class="grid">${s.releases.map(albumCell).join('')}</div>` : ''}`;
  },

  async artists() {
    const all = await api('/api/artists');
    return `<div class="tools">
        <input type="search" id="q" placeholder="search ${all.length} artists…">
        <label class="chk"><input type="checkbox" id="fol"> followed only</label>
      </div><div class="grid" id="out"></div>`;
  },

  async liked() {
    const all = await api('/api/tracks');
    const goneN = all.filter((t) => t.removed_at).length;
    return `<div class="tools"><input type="search" id="q" placeholder="search songs…">
      <label class="chk"><input type="checkbox" id="gone"> show un-liked (${goneN})</label></div>
      <h2>Liked (${all.length - goneN})</h2><div id="likedOut"></div>
      <h2>Everything in the library</h2><div id="allOut"></div>
      <div style="text-align:center;margin-top:1rem"><button class="spbtn" id="more">load more</button></div>`;
  },

  async albums() {
    const saved = await api('/api/albums');
    return `<div class="tools"><input type="search" id="q" placeholder="search albums…"></div>
      ${saved.length ? `<h2>Saved (${saved.length})</h2><div class="grid" id="savedOut"></div>` : ''}
      <h2>All albums</h2><div class="grid" id="allOut"></div>
      <div style="text-align:center;margin-top:1rem"><button class="spbtn" id="more">load more</button></div>`;
  },

  async playlists() {
    const pls = await api('/api/playlists');
    if (!pls.length) return '<div class="empty">no playlists synced yet</div>';
    return `<div class="tools"><div class="seg" id="plseg">${pls.map((p, i) =>
        `<button data-id="${p.id}" class="${i === 0 ? 'on' : ''}">${esc(p.name)}${p.removed_at ? ' †' : ''} <span style="opacity:.6">${p.synced_tracks}</span></button>`).join('')}</div></div>
      <div class="rows" id="out"><div class="empty">loading…</div></div>`;
  },

  async top() {
    return `<div class="tools">
        <div class="seg" id="mode">
          <button data-m="plays" class="on">By plays</button>
          <button data-m="rank">Spotify ranking</button>
        </div>
        <div class="seg" id="rseg" style="display:none">
          <button data-r="short_term">4 weeks</button>
          <button data-r="medium_term" class="on">6 months</button>
          <button data-r="long_term">years</button></div>
        <div class="seg" id="pseg"></div>
      </div>
      <div id="topOut"><div class="empty">loading…</div></div>`;
  },

  async plays() {
    const all = await api('/api/plays');
    if (!all.length) return '<div class="empty">no plays captured yet</div>';
    return `<div class="rows">${all.map((p) => trackRow(p, ago(p.played_at))).join('')}</div>`;
  },

  async shows() {
    const d = await api('/api/events');
    if (!d.near.length && !d.elsewhere.length) {
      return '<div class="empty">no shows known yet — needs a (free) Ticketmaster API key, see the README</div>';
    }
    return `<h2>Near you (${d.countries.join(', ')})</h2>
      ${d.near.length ? `<div class="rows">${d.near.map(eventRow).join('')}</div>` : '<div class="empty">nothing announced nearby</div>'}
      ${d.elsewhere.length ? `<h2>Elsewhere (${d.elsewhere.length})</h2><div class="rows">${d.elsewhere.map(eventRow).join('')}</div>` : ''}`;
  },

  async artist(id) {
    const d = await api(`/api/artist?id=${id}`);
    if (!d.artist) return '<div class="empty">unknown artist</div>';
    const a = d.artist;
    const ranks = { short_term: '4w', medium_term: '6mo', long_term: 'yrs' };
    const meta = [
      a.followers ? `${Number(a.followers).toLocaleString()} followers` : '',
      a.popularity != null ? `popularity ${a.popularity}` : '',
      d.liked.filter((t) => !t.removed_at).length ? `${d.liked.filter((t) => !t.removed_at).length} liked tracks` : '',
      ...d.topRanks.map((r) => `#${r.rank} (${ranks[r.time_range] ?? r.time_range})`),
    ].filter(Boolean).join(' · ');
    const groups = [['album', 'Albums'], ['single', 'Singles & EPs'], ['compilation', 'Compilations']];
    const discog = groups.map(([g, title]) => {
      const rows = d.albums.filter((al) => (al.album_group ?? 'album') === g);
      return rows.length ? `<h2>${title} (${rows.length})</h2><div class="grid">${rows.map(albumCell).join('')}</div>` : '';
    }).join('');
    return `<div class="hero">
        ${pic('artists', a.id, a.image_url, a.name)}
        <div>
          <h1>${a.is_followed ? '★ ' : ''}${esc(a.name)}</h1>
          ${badges(a)}
          ${gchips(a.genres, 8)}
          <div class="meta">${meta}</div>
          ${spbtn('artist', a.id)}
        </div>
      </div>
      ${d.events?.length ? `<h2>Upcoming shows</h2><div class="rows">${d.events.map((e) => eventRow({ ...e, artist_name: a.name, image_url: a.image_url })).join('')}</div>` : ''}
      ${a.discog_synced_at ? '' : '<div class="note">full discography not crawled yet — showing what the library knows so far</div>'}
      ${discog || '<div class="empty">no albums known yet</div>'}
      ${d.liked.length ? `<h2>Liked tracks</h2><div class="rows">${d.liked.map((t) => trackRow(t, day(t.added_at))).join('')}</div>` : ''}`;
  },

  async album(id) {
    const d = await api(`/api/album?id=${id}`);
    if (!d.album) return '<div class="empty">unknown album</div>';
    const al = d.album;
    const artistLinks = d.artists.map((x) => `<a href="#artist/${x.id}"><b>${esc(x.name)}</b></a>`).join(', ');
    const meta = [
      (al.release_date ?? '').slice(0, 10), al.album_type,
      al.total_tracks ? `${al.total_tracks} tracks` : '',
      al.label || '', al.popularity != null ? `popularity ${al.popularity}` : '',
      al.is_saved ? `saved ${day(al.saved_at)} ✓` : '',
    ].filter(Boolean).join(' · ');
    const discs = [...new Set(d.tracks.map((t) => t.disc_number ?? 1))].sort();
    const list = discs.map((disc) => {
      const rows = d.tracks.filter((t) => (t.disc_number ?? 1) === disc).map((t) => `
        <div class="row">
          <span class="rank">${t.track_number ?? ''}</span>
          ${playControl(t)}
          <span class="heart">${t.liked ? '♥' : ''}</span>
          <div class="mid"><div>${esc(t.name)}</div>
            <div class="sub">${esc(t.artists ?? '')}</div></div>
          <div class="end">${dur(t.duration_ms)}</div>
          ${spotify('track', t.id)}
        </div>`).join('');
      return (discs.length > 1 ? `<h2>Disc ${disc}</h2>` : '') + `<div class="rows">${rows}</div>`;
    }).join('');
    return `<div class="hero">
        ${pic('albums', al.id, al.image_url, al.name, al.downloaded ? dlBadge : '')}
        <div>
          <h1>${esc(al.name)}</h1>
          <div class="meta">${artistLinks}</div>
          <div class="meta">${meta}</div>
          ${badges(al)}
          <div class="hero-actions">
            ${al.downloaded && d.tracks.length ? `<button class="primary-action play-album" type="button">${PLAY} Play album</button>` : ''}
            ${spbtn('album', al.id)}
          </div>
        </div>
      </div>
      <h2>Tracks${d.tracks.length ? ` (${d.tracks.length} in library)` : ''}</h2>
      ${d.tracks.length ? list : '<div class="empty">track listing not hydrated yet — next sync runs will fill it in</div>'}`;
  },
};

const after = {
  artists(el) {
    api('/api/artists').then((all) => {
      const out = $('#out', el), q = $('#q', el), fol = $('#fol', el);
      const draw = () => {
        const needle = q.value.toLowerCase();
        const rows = all.filter((a) =>
          (!fol.checked || a.is_followed) &&
          (!needle || a.name.toLowerCase().includes(needle) || (a.genres ?? '').toLowerCase().includes(needle)));
        out.innerHTML = rows.map((a) => `
          <div class="cell">
            <a href="#artist/${a.id}">${pic('artists', a.id, a.image_url, a.name)}
              <div class="nm">${a.is_followed ? '★ ' : ''}${esc(a.name)}</div></a>
            <div class="sub">${a.liked_count ? a.liked_count + ' liked' : ''}${a.top_rank ? (a.liked_count ? ' · ' : '') + '#' + a.top_rank : ''}</div>
            ${badges(a)}
            ${gchips(a.genres)}
          </div>`).join('') || '<div class="empty">no matches</div>';
      };
      q.addEventListener('input', draw); fol.addEventListener('change', draw); draw();
    });
  },
  liked(el) {
    api('/api/tracks').then((all) => {
      const likedOut = $('#likedOut', el), q = $('#q', el), gone = $('#gone', el);
      // Liked songs, grouped by album, most recently liked group first.
      const draw = () => {
        const needle = q.value.toLowerCase();
        const rows = all.filter((t) => (gone.checked || !t.removed_at) &&
          (!needle || `${t.name} ${t.artists} ${t.album}`.toLowerCase().includes(needle)));
        const byAlbum = new Map();
        for (const t of rows) {
          const key = t.album_id ?? `~${t.id}`;
          if (!byAlbum.has(key)) byAlbum.set(key, { id: t.album_id, name: t.album, image_url: t.image_url, release_date: t.release_date, artists: t.artists, tracks: [] });
          byAlbum.get(key).tracks.push(t);
        }
        likedOut.innerHTML = [...byAlbum.values()].map((al) =>
          groupHead(al) + `<div class="rows">${al.tracks.map((t) => slimRow(t, `${day(t.added_at)} · ${dur(t.duration_ms)}`)).join('')}</div>`
        ).join('') || '<div class="empty">no matches</div>';
      };
      const paged = pager({
        url: '/api/songs', pageSize: 200,
        container: $('#allOut', el), moreBtn: $('#more', el),
        render: songGroup, empty: 'nothing yet — track listings hydrate over the next sync runs',
      });
      q.addEventListener('input', debounce(() => { draw(); paged.search(q.value); }));
      gone.addEventListener('change', draw);
      draw();
    });
  },
  albums(el) {
    const q = $('#q', el), savedOut = $('#savedOut', el);
    const drawSaved = () => {
      if (!savedOut) return;
      api('/api/albums').then((saved) => {
        const needle = q.value.toLowerCase();
        savedOut.innerHTML = saved
          .filter((a) => !needle || `${a.name} ${a.artists}`.toLowerCase().includes(needle))
          .map(albumCell).join('') || '<div class="empty">no matches</div>';
      });
    };
    const paged = pager({
      url: '/api/albums-all', pageSize: 500,
      container: $('#allOut', el), moreBtn: $('#more', el),
      render: albumCell, empty: 'discography crawl still running — this fills in over the coming days',
    });
    q.addEventListener('input', debounce(() => { drawSaved(); paged.search(q.value); }));
    drawSaved();
  },
  playlists(el) {
    const seg = $('#plseg', el), out = $('#out', el);
    const load = (id) => fetch(`/api/playlist-tracks?id=${id}`).then((r) => r.json()).then((rows) => {
      out.innerHTML = rows.map((t) => trackRow(t, `${day(t.added_at)}<br>${dur(t.duration_ms)}`, t.position)).join('')
        || '<div class="empty">empty (or blocked by the API — see README)</div>';
    });
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      load(b.dataset.id);
    });
    const first = seg.querySelector('button'); if (first) load(first.dataset.id);
  },
  top(el) {
    const mode = $('#mode', el), rseg = $('#rseg', el), pseg = $('#pseg', el), out = $('#topOut', el);

    const loadRank = async (range) => {
      const [artists, tracks] = await Promise.all([
        api(`/api/top-artists?range=${range}`), api(`/api/top-tracks?range=${range}`)]);
      out.innerHTML = `<div class="cards">
        <div class="card"><h2>Top artists</h2><div class="rows">${artists.map((a) => `
          <div class="row"><span class="rank">${a.rank}</span>
            <a href="#artist/${a.id}">${pic('artists', a.id, a.image_url, a.name)}</a>
            <div class="mid"><div><a href="#artist/${a.id}">${esc(a.name)}</a></div>
            <div class="sub">${genres(a.genres, 2).join(', ')}</div></div>
            ${spotify('artist', a.id)}</div>`).join('') || '<div class="empty">not synced yet</div>'}</div></div>
        <div class="card"><h2>Top tracks</h2><div class="rows">${tracks.map((t) => trackRow(t, '', t.rank)).join('') || '<div class="empty">not synced yet</div>'}</div></div>
      </div>`;
    };

    // Wrapped-for-any-range: play counts from lifetime history + API capture.
    const loadPlays = async (from, to) => {
      out.innerHTML = '<div class="empty">counting…</div>';
      const d = await (await fetch(`/api/wrapped?from=${from}&to=${to}`)).json();
      const t = d.totals ?? {};
      if (!t.plays) {
        out.innerHTML = '<div class="empty">no plays in this range — the API capture builds from now on, and the extended-history import fills the past</div>';
        return;
      }
      const tiles = [['plays', Number(t.plays).toLocaleString()], ['hours', Math.round((t.ms ?? 0) / 3.6e6).toLocaleString()],
                     ['different tracks', Number(t.tracks).toLocaleString()], ['different artists', Number(t.artists).toLocaleString()]]
        .map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join('');
      const artistRow = (a, i) => `
        <div class="row"><span class="rank">${i + 1}</span>
          ${a.artist_id ? `<a href="#artist/${a.artist_id}">` : ''}${pic('artists', a.artist_id, a.image_url, a.artist_name)}${a.artist_id ? '</a>' : ''}
          <div class="mid"><div>${a.artist_id ? `<a href="#artist/${a.artist_id}">${esc(a.artist_name)}</a>` : esc(a.artist_name)}</div>
          <div class="sub">${Math.round(a.ms / 3.6e6)}h</div></div>
          <div class="end">${a.plays}×</div></div>`;
      const trackRow2 = (x, i) => `
        <div class="row"><span class="rank">${i + 1}</span>
          ${playControl({ id: x.id, name: x.track_name, artist_name: x.artist_name, duration_ms: x.ms })}
          <div class="mid"><div>${esc(x.track_name)}</div><div class="sub">${esc(x.artist_name ?? '')}</div></div>
          <div class="end">${x.plays}×</div>${x.id ? spotify('track', x.id) : ''}</div>`;
      const albumRow = (x, i) => `
        <div class="row"><span class="rank">${i + 1}</span>
          ${x.album_id ? `<a href="#album/${x.album_id}">` : ''}${pic('albums', x.album_id, x.image_url, x.album_name)}${x.album_id ? '</a>' : ''}
          <div class="mid"><div>${x.album_id ? `<a href="#album/${x.album_id}">${esc(x.album_name)}</a>` : esc(x.album_name)}</div>
          <div class="sub">${esc(x.artist_name ?? '')}</div></div>
          <div class="end">${x.plays}×</div></div>`;
      out.innerHTML = `<div class="tiles">${tiles}</div>
        <div class="card" style="margin-bottom:1rem"><h2>Plays per month</h2>${monthChart(d.perMonth, 'plays')}</div>
        <div class="cards">
          <div class="card"><h2>Top artists</h2><div class="rows">${d.topArtists.map(artistRow).join('')}</div></div>
          <div class="card"><h2>Top tracks</h2><div class="rows">${d.topTracks.map(trackRow2).join('')}</div></div>
          <div class="card"><h2>Top albums</h2><div class="rows">${d.topAlbums.map(albumRow).join('')}</div></div>
        </div>`;
    };

    // Range chips: presets + one per year of data.
    api('/api/wrapped?from=9999&to=9999').then((d) => {
      const now = new Date();
      const iso = (dt) => dt.toISOString().slice(0, 10);
      const presets = [
        ['All time', '0000', '9999'],
        ['12 months', iso(new Date(now - 365 * 864e5)), '9999'],
        ['3 months', iso(new Date(now - 91 * 864e5)), '9999'],
        ['4 weeks', iso(new Date(now - 28 * 864e5)), '9999'],
        ...(d.years ?? []).filter((y) => y >= '2000').reverse().map((y) => [y, y, y + '~']),
      ];
      pseg.innerHTML = presets.map(([label, f, t], i) =>
        `<button data-f="${f}" data-t="${t}" class="${i === 0 ? 'on' : ''}">${label}</button>`).join('');
      pseg.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        pseg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        loadPlays(b.dataset.f, b.dataset.t);
      });
    });

    mode.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      mode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      const plays = b.dataset.m === 'plays';
      rseg.style.display = plays ? 'none' : '';
      pseg.style.display = plays ? '' : 'none';
      if (plays) loadPlays('0000', '9999');
      else loadRank(rseg.querySelector('.on').dataset.r);
    });
    rseg.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      rseg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      loadRank(b.dataset.r);
    });
    loadPlays('0000', '9999');
  },
};

const TABS = { overview: 'Overview', artists: 'Artists', liked: 'Songs', albums: 'Albums', playlists: 'Playlists', top: 'Top', shows: 'Shows', plays: 'Plays' };
const TAB_ICONS = {
  overview: '<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>',
  artists: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  liked: '<svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>',
  albums: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3"/></svg>',
  playlists: '<svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7M18 14v6m-3-3h6"/></svg>',
  top: '<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  shows: '<svg viewBox="0 0 24 24"><path d="M6 3v18M18 3v18M6 7h12M6 17h12"/><path d="M10 11h4v2h-4z"/></svg>',
  plays: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8"/><path d="M4 3v5h5"/><path d="m10 9 5 3-5 3z"/></svg>',
};
const PAGE_COPY = {
  overview: ['Your listening memory', 'The collection'], artists: ['Everyone in your orbit', 'Artists'],
  liked: ['Saved, remembered, searchable', 'Songs'], albums: ['The record shelf', 'Albums'],
  playlists: ['Your hand-built paths', 'Playlists'], top: ['Listening, counted honestly', 'Your top music'],
  shows: ['Artists leaving the speakers', 'Upcoming shows'], plays: ['The latest signals', 'Recently played'],
};
const nav = $('#nav');
nav.innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${TAB_ICONS[k]}<span>${v}</span></button>`).join('');
nav.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.t; });

async function show() {
  const hash = location.hash.slice(1);
  const detail = hash.match(/^(artist|album)\/([A-Za-z0-9]+)$/);
  const tab = detail ? null : (TABS[hash] ? hash : 'overview');
  nav.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  const copy = detail ? [detail[1] === 'artist' ? 'Artist in your archive' : 'Release in your archive', detail[1] === 'artist' ? 'Artist' : 'Album'] : PAGE_COPY[tab];
  $('#page-kicker').textContent = copy[0];
  $('#page-title').textContent = copy[1];
  const main = $('#main');
  try {
    if (detail) {
      main.innerHTML = await views[detail[1]](detail[2]);
    } else {
      main.innerHTML = await views[tab]();
      after[tab]?.(main);
    }
    scrollTo(0, 0);
    main.querySelectorAll('[data-tip]').forEach((el) => tipOn(el, el.dataset.tip));
  } catch (err) {
    main.innerHTML = `<div class="empty">${esc(err.message)} — is the database there yet?</div>`;
  }
}
addEventListener('hashchange', show);

api('/api/stats')
  .then((s) => { $('#sync').textContent = s.lastSync ? `last sync ${ago(s.lastSync)}` : 'first sync pending'; })
  .catch(() => { $('#sync').textContent = 'db not ready'; });
show();
</script>
<script src="/player.js"></script>
</body>
</html>
